<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sharathi — AI Social Messaging Agent by Riverborn">
  <defs>
    <radialGradient id="limeGlow" cx="15%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D4F53C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4F53C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistGlow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#9FCEBE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9FCEBE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4F53C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4F53C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4F53C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#0D2B22"/>
  <rect width="1200" height="260" fill="url(#limeGlow)"/>
  <rect width="1200" height="260" fill="url(#mistGlow)"/>

  <rect x="0" y="0" width="1200" height="260" fill="none" stroke="#132F25" stroke-width="1"/>

  <g>

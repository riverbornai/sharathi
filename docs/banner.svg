    <text x="112" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#F2FFEE" letter-spacing="1">Sharathi</text>
  </g>

  <g>
    <circle cx="115" cy="196" r="4" fill="#D4F53C"/>
    <text x="130" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9FCEBE" letter-spacing="0.5">AI Social Messaging Agent</text>
    <text x="410" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4E6A5E">·</text>
    <text x="425" y="201" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#D4F53C" letter-spacing="0.5">Riverborn</text>
  </g>

  <line x1="80" y1="222" x2="900" y2="222" stroke="url(#frameLine)" stroke-width="1"/>

  <text x="1120" y="238" font-family="'Courier New', monospace" font-size="13" fill="#4E6A5E" text-anchor="end">Node · Express · React · OpenAI</text>
